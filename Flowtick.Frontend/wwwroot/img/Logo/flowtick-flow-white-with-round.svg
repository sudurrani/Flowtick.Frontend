<svg xmlns="http://www.w3.org/2000/svg" width="520" height="140" viewBox="0 0 520 140">
  <title>Flowtick Wordmark – Dark Background Version</title>
  <desc>Flowtick full horizontal logo with icon, Flow in white, tick in teal — for dark backgrounds</desc>

  <!-- Icon mark -->
  <circle cx="70" cy="70" r="52" fill="#0d9488"/>

  <!-- Flow bars -->
  <rect x="46" y="84" width="44" height="10" rx="5" fill="rgba(255,255,255,0.35)"/>
  <rect x="50" y="68" width="54" height="10" rx="5" fill="rgba(255,255,255,0.65)"/>
  <rect x="46" y="52" width="48" height="10" rx="5" fill="#ffffff"/>

  <!-- Tick checkmark -->
  <path d="M95,62 L101,72 L114,56"
        fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "Flow" in white -->
  <text x="140" y="90"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="-2"
        fill="#ffffff">Flow</text>

  <!-- "tick" in teal -->
  <text x="252" y="90"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="-2"
        fill="#0d9488">tick</text>

  <!-- Tagline in soft white -->
  <text x="141" y="114"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="0.4"
        fill="rgba(255,255,255,0.6)">Project &amp; Task Management, Simplified</text>
</svg>
